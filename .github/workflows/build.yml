name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxinerama-dev libxext-dev libxrandr-dev libxcursor-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-g1" 2>&1 | tee -a ci.log; exit ${PIPESTATUS[0]}
      - name: Core tests (editing model, operations, recorder; no JUCE)
        run: |
          cmake --build build --config Release --target test_core test_dsp 2>&1 | tee -a ci.log; [ ${PIPESTATUS[0]} -eq 0 ] || exit 1
          ctest --test-dir build -C Release --output-on-failure 2>&1 | tee -a ci.log; exit ${PIPESTATUS[0]}
      - name: Build (VST3 plugin and standalone app)
        run: cmake --build build --config Release --parallel 4 2>&1 | tee -a ci.log; exit ${PIPESTATUS[0]}
      - name: pluginval level 5 (Linux)
        if: runner.os == 'Linux'
        run: |
          set +e +o pipefail
          curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip && unzip -q pv.zip
          xvfb-run -a ./pluginval --strictness-level 5 --validate-in-process "build/Meowcorder_artefacts/Release/VST3/Meowcorder.vst3" 2>&1 | tee -a ci.log; rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            sudo apt-get install -y gdb > /dev/null
            echo "=== backtrace of the crash ===" | tee -a ci.log
            xvfb-run -a gdb -batch -ex run -ex "bt 14" --args ./pluginval --strictness-level 5 --validate-in-process "build/Meowcorder_artefacts/Release/VST3/Meowcorder.vst3" 2>&1 | grep -E "^#|SIG" | cut -c1-230 | tail -30 | tee -a ci.log
          fi
          exit $rc
      - name: pluginval level 5 (Windows)
        if: runner.os == 'Windows'
        run: |
          curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip && 7z x -y pv.zip > /dev/null
          ./pluginval.exe --strictness-level 5 --validate-in-process "build/Meowcorder_artefacts/Release/VST3/Meowcorder.vst3" 2>&1 | tee -a ci.log; exit ${PIPESTATUS[0]}
      - name: Window snapshot (Linux, headless)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          set +e
          for what in 1 2 3 4; do
            MEOW_DEMO=$what MEOW_SNAPSHOT="$PWD/snap$what.png" timeout 60 xvfb-run -a -s "-screen 0 1600x1000x24" "build/Meowcorder_artefacts/Release/Standalone/Meowcorder" 2>&1 | tail -5 | tee -a ci.log
            ls -la snap$what.png 2>&1 | tee -a ci.log
          done
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: Meowcorder-${{ runner.os }}
          path: build/*_artefacts/
          if-no-files-found: warn
      - name: Publish log to ci-log branch
        if: always()
        run: |
          mkdir -p /tmp/logpub && cp ci.log /tmp/logpub/${{ runner.os }}.log || true
          tail -n 400 /tmp/logpub/${{ runner.os }}.log > /tmp/logpub/${{ runner.os }}.tail.log || true
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git fetch origin ci-log || true
          git checkout -B ci-log $(git rev-parse --verify -q origin/ci-log || echo HEAD)
          [ -n "$(git rev-parse --verify -q origin/ci-log)" ] || git rm -rf -q . || true
          mkdir -p logs && cp /tmp/logpub/*.tail.log logs/ && (cp "$GITHUB_WORKSPACE"/snap*.png logs/ 2>/dev/null || true) && git add logs
          git commit -q -m "ci log ${{ runner.os }} $GITHUB_SHA" || true
          git push origin ci-log || true
